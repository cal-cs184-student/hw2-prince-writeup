<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Boundary edge split before and after</title>
  <desc id="desc">A boundary edge shared by one triangle and the boundary face is split at its midpoint.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <style>
      .panel-title { font: 700 24px sans-serif; fill: #111827; }
      .label { font: 600 18px sans-serif; fill: #111827; }
      .small { font: 15px monospace; fill: #374151; }
      .face { font: 700 18px sans-serif; fill: #334155; }
      .edge { stroke: #1f2937; stroke-width: 3; fill: none; }
      .new-edge { stroke: #7c3aed; stroke-width: 5; fill: none; }
      .boundary-edge { stroke: #475569; stroke-width: 4; fill: none; }
      .vertex { fill: #ffffff; stroke: #111827; stroke-width: 3; }
      .midpoint { fill: #f59e0b; stroke: #92400e; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="500" rx="18" fill="#f8fafc"/>
  <line x1="600" y1="30" x2="600" y2="465" stroke="#cbd5e1" stroke-width="2"/>

  <text x="285" y="48" text-anchor="middle" class="panel-title">Before: one interior face</text>
  <rect x="70" y="300" width="430" height="135" rx="12" fill="#e2e8f0"/>
  <polygon points="115,300 455,300 285,85" fill="#dbeafe" stroke="none"/>
  <path d="M115 300 L285 85 L455 300 Z" class="edge"/>
  <line x1="115" y1="300" x2="455" y2="300" class="boundary-edge"/>

  <line x1="135" y1="288" x2="435" y2="288" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="435" y1="312" x2="135" y2="312" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="105" y1="320" x2="62" y2="372" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>

  <circle cx="285" cy="85" r="10" class="vertex"/>
  <circle cx="115" cy="300" r="10" class="vertex"/>
  <circle cx="455" cy="300" r="10" class="vertex"/>
  <text x="285" y="70" text-anchor="middle" class="label">a</text>
  <text x="94" y="306" text-anchor="middle" class="label">b</text>
  <text x="476" y="306" text-anchor="middle" class="label">c</text>

  <text x="285" y="210" text-anchor="middle" class="face">f0</text>
  <text x="285" y="405" text-anchor="middle" class="face">boundaryface</text>
  <text x="285" y="272" text-anchor="middle" class="small">h00 (e0)</text>
  <text x="285" y="340" text-anchor="middle" class="small">h01 (e0)</text>
  <text x="170" y="170" class="small">h20</text>
  <text x="395" y="170" class="small">h10</text>
  <text x="72" y="395" text-anchor="middle" class="small">h11</text>

  <text x="880" y="48" text-anchor="middle" class="panel-title">After: two interior faces</text>
  <rect x="620" y="300" width="500" height="135" rx="12" fill="#e2e8f0"/>
  <polygon points="650,300 860,300 860,85" fill="#dbeafe" stroke="none"/>
  <polygon points="860,300 1070,300 860,85" fill="#e0e7ff" stroke="none"/>
  <path d="M650 300 L860 85 L1070 300 Z" class="edge"/>
  <line x1="650" y1="300" x2="1070" y2="300" class="boundary-edge"/>
  <line x1="860" y1="85" x2="860" y2="300" class="new-edge"/>

  <line x1="670" y1="288" x2="840" y2="288" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="840" y1="312" x2="670" y2="312" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="880" y1="288" x2="1050" y2="288" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="1050" y1="312" x2="880" y2="312" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="848" y1="280" x2="848" y2="105" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="872" y1="105" x2="872" y2="280" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="640" y1="320" x2="602" y2="372" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>

  <circle cx="860" cy="85" r="10" class="vertex"/>
  <circle cx="650" cy="300" r="10" class="vertex"/>
  <circle cx="1070" cy="300" r="10" class="vertex"/>
  <circle cx="860" cy="300" r="12" class="midpoint"/>
  <text x="860" y="70" text-anchor="middle" class="label">a</text>
  <text x="629" y="306" text-anchor="middle" class="label">b</text>
  <text x="1091" y="306" text-anchor="middle" class="label">c</text>
  <text x="860" y="360" text-anchor="middle" class="label">m</text>

  <text x="775" y="205" text-anchor="middle" class="face">f0</text>
  <text x="945" y="205" text-anchor="middle" class="face">f2</text>
  <text x="870" y="405" text-anchor="middle" class="face">boundaryface</text>

  <text x="755" y="272" text-anchor="middle" class="small">h00 (e0)</text>
  <text x="755" y="340" text-anchor="middle" class="small">h_mb (e0)</text>
  <text x="965" y="272" text-anchor="middle" class="small">h_mc (mc)</text>
  <text x="965" y="340" text-anchor="middle" class="small">h01 (mc)</text>
  <text x="815" y="155" text-anchor="middle" class="small">h_ma</text>
  <text x="905" y="155" text-anchor="middle" class="small">h_am</text>
  <text x="677" y="178" class="small">h20</text>
  <text x="1015" y="178" class="small">h10</text>
  <text x="610" y="395" text-anchor="middle" class="small">h11</text>

  <text x="600" y="482" text-anchor="middle" class="small">m = (b.position + c.position) / 2</text>
</svg>
