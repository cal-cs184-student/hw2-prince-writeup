<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Interior edge split before and after</title>
  <desc id="desc">The shared edge b-c is split at midpoint m, changing two triangles into four.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <style>
      .panel-title { font: 700 24px sans-serif; fill: #111827; }
      .label { font: 600 18px sans-serif; fill: #111827; }
      .small { font: 15px monospace; fill: #374151; }
      .face { font: 700 18px sans-serif; fill: #334155; }
      .edge { stroke: #1f2937; stroke-width: 3; fill: none; }
      .new-edge { stroke: #7c3aed; stroke-width: 5; fill: none; }
      .vertex { fill: #ffffff; stroke: #111827; stroke-width: 3; }
      .midpoint { fill: #f59e0b; stroke: #92400e; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="18" fill="#f8fafc"/>
  <line x1="600" y1="35" x2="600" y2="485" stroke="#cbd5e1" stroke-width="2"/>

  <text x="290" y="50" text-anchor="middle" class="panel-title">Before: two faces</text>
  <polygon points="115,250 455,250 285,90" fill="#dbeafe" stroke="none"/>
  <polygon points="455,250 115,250 285,410" fill="#fee2e2" stroke="none"/>
  <path d="M115 250 L285 90 L455 250 L285 410 Z M115 250 L455 250" class="edge"/>

  <line x1="135" y1="238" x2="435" y2="238" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="435" y1="262" x2="135" y2="262" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="285" y="235" text-anchor="middle" class="small">h00 (e0)</text>
  <text x="285" y="278" text-anchor="middle" class="small">h01 (e0)</text>

  <circle cx="285" cy="90" r="10" class="vertex"/>
  <circle cx="115" cy="250" r="10" class="vertex"/>
  <circle cx="455" cy="250" r="10" class="vertex"/>
  <circle cx="285" cy="410" r="10" class="vertex"/>
  <text x="285" y="76" text-anchor="middle" class="label">a</text>
  <text x="94" y="256" text-anchor="middle" class="label">b</text>
  <text x="476" y="256" text-anchor="middle" class="label">c</text>
  <text x="285" y="442" text-anchor="middle" class="label">d</text>
  <text x="285" y="190" text-anchor="middle" class="face">f0</text>
  <text x="285" y="320" text-anchor="middle" class="face">f1</text>
  <text x="178" y="152" class="small">h20</text>
  <text x="391" y="152" class="small">h10</text>
  <text x="178" y="372" class="small">h11</text>
  <text x="391" y="372" class="small">h21</text>

  <text x="900" y="50" text-anchor="middle" class="panel-title">After: four faces</text>
  <polygon points="690,250 860,250 860,90" fill="#dbeafe" stroke="none"/>
  <polygon points="860,250 1030,250 860,90" fill="#e0e7ff" stroke="none"/>
  <polygon points="860,250 690,250 860,410" fill="#fee2e2" stroke="none"/>
  <polygon points="1030,250 860,250 860,410" fill="#ffedd5" stroke="none"/>
  <path d="M690 250 L860 90 L1030 250 L860 410 Z M690 250 L1030 250" class="edge"/>
  <path d="M860 90 L860 410" class="new-edge"/>

  <line x1="710" y1="238" x2="842" y2="238" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="842" y1="262" x2="710" y2="262" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="878" y1="238" x2="1010" y2="238" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="1010" y1="262" x2="878" y2="262" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>

  <circle cx="860" cy="90" r="10" class="vertex"/>
  <circle cx="690" cy="250" r="10" class="vertex"/>
  <circle cx="1030" cy="250" r="10" class="vertex"/>
  <circle cx="860" cy="410" r="10" class="vertex"/>
  <circle cx="860" cy="250" r="12" class="midpoint"/>
  <text x="860" y="76" text-anchor="middle" class="label">a</text>
  <text x="669" y="256" text-anchor="middle" class="label">b</text>
  <text x="1051" y="256" text-anchor="middle" class="label">c</text>
  <text x="860" y="442" text-anchor="middle" class="label">d</text>
  <text x="860" y="290" text-anchor="middle" class="label">m</text>

  <text x="805" y="190" text-anchor="middle" class="face">f0</text>
  <text x="915" y="190" text-anchor="middle" class="face">f2</text>
  <text x="805" y="320" text-anchor="middle" class="face">f1</text>
  <text x="915" y="320" text-anchor="middle" class="face">f3</text>
  <text x="775" y="225" text-anchor="middle" class="small">h00 (e0)</text>
  <text x="775" y="285" text-anchor="middle" class="small">h01 (e0)</text>
  <text x="955" y="225" text-anchor="middle" class="small">h_mc (mc)</text>
  <text x="955" y="285" text-anchor="middle" class="small">h_cm (mc)</text>
  <text x="874" y="155" class="small">ma</text>
  <text x="874" y="350" class="small">md</text>

  <text x="600" y="505" text-anchor="middle" class="small">m = (b.position + c.position) / 2</text>
</svg>
