<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Three stages of Root-3 subdivision</title>
  <desc id="desc">Insert face centroids, connect each centroid to the corners, and flip the shared original edge to connect the two centroids.</desc>
  <defs>
    <style>
      .title { font: 700 21px sans-serif; fill: #111827; }
      .subtitle { font: 15px sans-serif; fill: #475569; }
      .vertex-label { font: 600 17px sans-serif; fill: #111827; }
      .centroid-label { font: 700 16px sans-serif; fill: #92400e; }
      .edge { stroke: #1f2937; stroke-width: 3; fill: none; }
      .old-edge { stroke: #dc2626; stroke-width: 5; fill: none; }
      .removed-edge { stroke: #dc2626; stroke-width: 3; stroke-dasharray: 9 7; opacity: 0.3; fill: none; }
      .spoke { stroke: #7c3aed; stroke-width: 3; fill: none; }
      .flipped-edge { stroke: #059669; stroke-width: 6; fill: none; }
      .vertex { fill: #ffffff; stroke: #111827; stroke-width: 3; }
      .centroid { fill: #f59e0b; stroke: #92400e; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="470" rx="18" fill="#f8fafc"/>
  <line x1="400" y1="25" x2="400" y2="440" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="800" y1="25" x2="800" y2="440" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Stage 1 -->
  <text x="200" y="38" text-anchor="middle" class="title">Step 3a: Insert face centroids</text>

  <polygon points="70,235 330,235 200,85" fill="#dbeafe"/>
  <polygon points="330,235 70,235 200,385" fill="#fee2e2"/>
  <path d="M70 235 L200 85 L330 235 L200 385 Z M70 235 L330 235" class="edge"/>

  <circle cx="70" cy="235" r="9" class="vertex"/>
  <circle cx="330" cy="235" r="9" class="vertex"/>
  <circle cx="200" cy="85" r="9" class="vertex"/>
  <circle cx="200" cy="385" r="9" class="vertex"/>
  <circle cx="200" cy="185" r="11" class="centroid"/>
  <circle cx="200" cy="285" r="11" class="centroid"/>

  <text x="52" y="242" text-anchor="middle" class="vertex-label">a</text>
  <text x="348" y="242" text-anchor="middle" class="vertex-label">b</text>
  <text x="200" y="72" text-anchor="middle" class="vertex-label">p</text>
  <text x="200" y="414" text-anchor="middle" class="vertex-label">q</text>
  <text x="220" y="181" class="centroid-label">c0</text>
  <text x="220" y="302" class="centroid-label">c1</text>

  <!-- Stage 2 -->
  <text x="600" y="38" text-anchor="middle" class="title">Step 3b: Connect to all corners</text>

  <polygon points="470,235 730,235 600,85" fill="#dbeafe"/>
  <polygon points="730,235 470,235 600,385" fill="#fee2e2"/>
  <path d="M470 235 L600 85 L730 235 L600 385 Z" class="edge"/>
  <line x1="470" y1="235" x2="730" y2="235" class="old-edge"/>
  <path d="M600 185 L470 235 M600 185 L730 235 M600 185 L600 85
           M600 285 L470 235 M600 285 L730 235 M600 285 L600 385" class="spoke"/>

  <circle cx="470" cy="235" r="9" class="vertex"/>
  <circle cx="730" cy="235" r="9" class="vertex"/>
  <circle cx="600" cy="85" r="9" class="vertex"/>
  <circle cx="600" cy="385" r="9" class="vertex"/>
  <circle cx="600" cy="185" r="11" class="centroid"/>
  <circle cx="600" cy="285" r="11" class="centroid"/>

  <text x="452" y="242" text-anchor="middle" class="vertex-label">a</text>
  <text x="748" y="242" text-anchor="middle" class="vertex-label">b</text>
  <text x="600" y="72" text-anchor="middle" class="vertex-label">p</text>
  <text x="600" y="414" text-anchor="middle" class="vertex-label">q</text>
  <text x="620" y="181" class="centroid-label">c0</text>
  <text x="620" y="302" class="centroid-label">c1</text>
  <text x="600" y="224" text-anchor="middle" class="subtitle">original edge a-b</text>

  <!-- Stage 3 -->
  <text x="1000" y="38" text-anchor="middle" class="title">Step 4: Flip the original edge</text>

  <polygon points="870,235 1130,235 1000,85" fill="#dbeafe" opacity="0.55"/>
  <polygon points="1130,235 870,235 1000,385" fill="#fee2e2" opacity="0.55"/>
  <path d="M870 235 L1000 85 L1130 235 L1000 385 Z" class="edge"/>
  <line x1="870" y1="235" x2="1130" y2="235" class="removed-edge"/>
  <path d="M1000 185 L870 235 M1000 185 L1130 235 M1000 185 L1000 85
           M1000 285 L870 235 M1000 285 L1130 235 M1000 285 L1000 385" class="spoke"/>
  <line x1="1000" y1="185" x2="1000" y2="285" class="flipped-edge"/>

  <circle cx="870" cy="235" r="9" class="vertex"/>
  <circle cx="1130" cy="235" r="9" class="vertex"/>
  <circle cx="1000" cy="85" r="9" class="vertex"/>
  <circle cx="1000" cy="385" r="9" class="vertex"/>
  <circle cx="1000" cy="185" r="11" class="centroid"/>
  <circle cx="1000" cy="285" r="11" class="centroid"/>

  <text x="852" y="242" text-anchor="middle" class="vertex-label">a</text>
  <text x="1148" y="242" text-anchor="middle" class="vertex-label">b</text>
  <text x="1000" y="72" text-anchor="middle" class="vertex-label">p</text>
  <text x="1000" y="414" text-anchor="middle" class="vertex-label">q</text>
  <text x="1020" y="181" class="centroid-label">c0</text>
  <text x="1020" y="302" class="centroid-label">c1</text>
  <text x="1014" y="242" class="subtitle">new edge</text>

  <text x="600" y="455" text-anchor="middle" class="subtitle">
    For two adjacent original faces, c0 and c1 are the two vertices named vc during their respective face splits.
  </text>
</svg>
